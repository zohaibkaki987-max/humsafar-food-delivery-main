name: Add shared live delivery map

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-live-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply shared live map changes
        run: python3 scripts/update_shared_live_map.py

      - name: Commit changes and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/update_shared_live_map.py .github/workflows/add-shared-live-map.yml
          git add my_orders.php rider/rider-orders.php scripts/update_shared_live_map.py .github/workflows/add-shared-live-map.yml
          git diff --cached --quiet && exit 0
          git commit -m "Show shared live delivery map to customer and rider"
          git push origin HEAD:main
