name: Add Customer Pending Order Cancel Button

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-orders-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add pending-order cancel button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('my_orders.php')
          if not path.exists():
              raise SystemExit('my_orders.php not found')

          text = path.read_text(encoding='utf-8')
          marker = 'HUMSAFAR_PENDING_CANCEL_BUTTON_V1'

          if marker in text:
              print('Cancel button patch already present.')
              raise SystemExit(0)

          injection = r'''
          <!-- HUMSAFAR_PENDING_CANCEL_BUTTON_V1 -->
          <style id="humsafar-pending-cancel-css">
              .humsafar-cancel-order-btn {
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                  gap: 7px;
                  padding: 9px 13px;
                  border-radius: 9px;
                  border: 1px solid #dc3545;
                  background: #fff;
                  color: #dc3545;
                  text-decoration: none;
                  font-size: 11px;
                  font-weight: 800;
                  cursor: pointer;
              }
              .humsafar-cancel-order-btn:hover {
                  background: #dc3545;
                  color: #fff;
              }
          </style>
          <script>
          (function () {
              function addPendingCancelButtons() {
                  document.querySelectorAll('.order-card').forEach(function (card) {
                      if (!card.querySelector('.status-pending')) return;
                      if (card.querySelector('.humsafar-cancel-order-btn')) return;

                      var viewLink = card.querySelector('a[href*="order-details.php?id="]');
                      if (!viewLink) return;

                      var match = viewLink.getAttribute('href').match(/[?&]id=(\\d+)/i);
                      if (!match) return;

                      var orderId = match[1];
                      var actions = card.querySelector('.hcf-order-actions');

                      if (!actions) {
                          actions = document.createElement('div');
                          actions.className = 'hcf-order-actions';
                          viewLink.parentNode.insertBefore(actions, viewLink);
                      }

                      var button = document.createElement('a');
                      button.className = 'humsafar-cancel-order-btn';
                      button.href = 'cancel_order.php?order_id=' + encodeURIComponent(orderId);
                      button.innerHTML = '<i class="fas fa-xmark"></i> Cancel Order';
                      button.addEventListener('click', function (event) {
                          if (!window.confirm('Are you sure you want to cancel this pending order?')) {
                              event.preventDefault();
                          }
                      });

                      actions.appendChild(button);
                  });
              }

              if (document.readyState === 'loading') {
                  document.addEventListener('DOMContentLoaded', addPendingCancelButtons);
              } else {
                  addPendingCancelButtons();
              }
          })();
          </script>
          '''

          closing = '</body>'
          if closing not in text.lower():
              raise SystemExit('Could not find </body> in my_orders.php')

          idx = text.lower().rfind(closing)
          text = text[:idx] + injection + '\n' + text[idx:]
          path.write_text(text, encoding='utf-8')
          print('Pending-order cancel button added to my_orders.php')
          PY

      - name: Validate PHP
        run: php -l my_orders.php

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_orders.php
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add cancel button for pending customer orders"
          git push
