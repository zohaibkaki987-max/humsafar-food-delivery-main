name: Add Customer Pending Order Cancel Button

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-orders-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix pending-order cancel button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('my_orders.php')
          text = path.read_text(encoding='utf-8')

          # The browser needs exactly one regex escape: \d+.
          # Normalize any number of backslashes before d+ in this specific matcher.
          pattern = r'(var match = viewLink\.getAttribute\("href"\)\.match\(/\[\?&\]id=\()\\+d(\+\)/i\);)'
          fixed = r'\1\\d\2'
          new_text, count = re.subn(pattern, fixed, text)

          if count:
              path.write_text(new_text, encoding='utf-8')
              print(f'Fixed pending cancel order-id regex ({count} occurrence(s)).')
          else:
              # If the matcher is already correct, leave it alone.
              if 'match(/[?&]id=(\\d+)/i)' in text:
                  print('Cancel button regex already correct.')
              else:
                  raise SystemExit('Pending cancel order-id matcher not found; refusing to modify unrelated code.')
          PY

      - name: Validate PHP
        run: php -l my_orders.php

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_orders.php
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix pending order cancel button rendering"
          git push
