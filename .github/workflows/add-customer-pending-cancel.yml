name: Add Customer Pending Order Cancel Button

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-orders-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix pending-order cancel button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('my_orders.php')
          if not path.exists():
              raise SystemExit('my_orders.php not found')

          text = path.read_text(encoding='utf-8')

          # The button is already rendered by the page's pending-cancel block.
          # The remaining bug is the JavaScript regex: the source currently
          # contains two backslashes (\\\\d), so the regex searches for a
          # literal backslash+d instead of a digit. Replace it with \\d.
          broken = r'var match = viewLink.getAttribute("href").match(/[?&]id=(\\d+)/i);'
          fixed = r'var match = viewLink.getAttribute("href").match(/[?&]id=(\d+)/i);'

          if broken in text:
              text = text.replace(broken, fixed)
              path.write_text(text, encoding='utf-8')
              print('Fixed pending-order cancel button order-id regex.')
          elif fixed in text:
              print('Cancel button regex is already correct.')
          else:
              raise SystemExit('Expected cancel-button regex was not found.')
          PY

      - name: Validate PHP
        run: php -l my_orders.php

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_orders.php
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix pending order cancel button order id regex"
          git push
