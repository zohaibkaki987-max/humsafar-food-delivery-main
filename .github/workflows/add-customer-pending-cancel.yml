name: Add Customer Pending Order Cancel Button

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-orders-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix pending cancel button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('my_orders.php')
          text = path.read_text(encoding='utf-8')

          old = 'var match = viewLink.getAttribute(\"href\").match(/[?&]id='
          start = text.find(old)
          if start < 0:
              raise SystemExit('Pending cancel matcher not found')
          end = text.find(';', start)
          if end < 0:
              raise SystemExit('Pending cancel matcher line is incomplete')

          line_end = end + 1
          replacement = '''var href = viewLink.getAttribute(\"href\") || \"\";\n            var idPos = href.indexOf(\"id=\");\n            if (idPos < 0) return;\n            var orderId = href.slice(idPos + 3).split(\"&\")[0].replace(/[^0-9]/g, \"\");\n            if (!orderId) return;'''

          text = text[:start] + replacement + text[line_end:]

          # Remove the old duplicate orderId declaration immediately after the matcher block.
          text = text.replace('            var orderId = match[1];\n', '', 1)
          path.write_text(text, encoding='utf-8')
          print('Replaced fragile regex with deterministic order-id extraction.')
          PY

      - name: Validate PHP
        run: php -l my_orders.php

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_orders.php
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix pending order cancel button rendering"
          git push
