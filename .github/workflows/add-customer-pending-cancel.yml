name: Add Customer Pending Order Cancel Button

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-orders-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix pending-order cancel button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('my_orders.php')
          if not path.exists():
              raise SystemExit('my_orders.php not found')

          text = path.read_text(encoding='utf-8')

          # The previous patch wrote a double backslash into the JavaScript regex.
          # That made the selector look for literal "\\d" instead of digits.
          old = r'(?i)'
          broken = r'[?&]id=(\\\\d+)'
          fixed = r'[?&]id=(\\d+)'

          if broken in text:
              text = text.replace(broken, fixed)
              path.write_text(text, encoding='utf-8')
              print('Fixed pending-order cancel button order-id regex.')
          else:
              print('Regex already correct or not found.')
          PY

      - name: Validate PHP
        run: php -l my_orders.php

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my_orders.php
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix pending order cancel button selector"
          git push
